{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>My Account</h1>

    <p>Welcome, {{ user.first_name }}!</p>

    <div>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Phone:</strong> {{ user.phone|default:"Not provided" }}</p>
    </div>

    <p>
        <a href="{% url 'accounts:logout' %}">Logout</a>
    </p>

    <p>
    <a href="{% url 'accounts:edit_profile' %}">
        Edit Profile
    </a>
</p>

<p>
    <a href="{% url 'accounts:change_password' %}">
        Change Password
    </a>
</p>

</div>

{% endblock %}
