{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Login</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="email">Email</label>
            <input
                type="email"
                name="email"
                id="email"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                type="password"
                name="password"
                id="password"
                required
            >
        </div>

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'accounts:register' %}">Create an account</a>
    </p>

</div>

{% endblock %}
